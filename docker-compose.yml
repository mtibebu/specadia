services:
  specadia:
    build: .
    image: specadia:latest
    volumes:
      - ./:/workspace:ro
      - ./.specadia:/app/.specadia
    stdin_open: true
    tty: true
    # Usage: docker compose run --rm specadia contract /workspace/requirements.md \
    #   --design /workspace/design.md --output-dir /app/.specadia/contracts
