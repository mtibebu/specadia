name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing annotated release tag to publish (for example v0.2.4). Must
          already exist on origin, be an annotated tag, and match v<version> in
          pyproject.toml. Used only to recover a missed release event; it does
          not move or recreate the tag or release.
        required: true
        type: string

permissions:
  contents: read

# Do not cancel an in-flight publish; allow a later legitimate release to queue
# behind it. RELEASE_TAG is the release tag for `release` events, or the manual
# `tag` input for `workflow_dispatch` recoveries.
concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # Validate the tag before using it further, then check out the exact
      # annotated tag. The value is passed via env and quoted; it is never
      # interpolated into a shell command.
      - name: Validate and check out release tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: python scripts/validate_release_tag.py "$RELEASE_TAG"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Verify distributions
        run: |
          python -m twine check dist/*
          python scripts/audit_distribution.py dist/*.whl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/specadia
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
