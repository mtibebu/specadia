name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m pytest -q
          tests/test_core_distribution.py
          tests/test_specadia_branding.py
          tests/contracts/test_context.py
          tests/contracts/test_generator.py
          tests/contracts/test_traceability.py
          tests/contracts/test_validation.py
      - run: python -m compileall -q src/specadia src/contracts src/diagnostics

  full-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[full,test]"
      - run: python -m pytest -q
      - run: python -m compileall -q src

  distribution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_distribution.py dist/*.whl
      - name: Test clean core wheel and CLIs
        run: |
          python -m venv /tmp/specadia-core
          /tmp/specadia-core/bin/python -m pip install dist/*.whl
          /tmp/specadia-core/bin/python -c "import importlib.util; assert importlib.util.find_spec('google') is None"
          /tmp/specadia-core/bin/specadia --version
          /tmp/specadia-core/bin/specadia --help
          /tmp/specadia-core/bin/specadia-contract --version
          /tmp/specadia-core/bin/specadia-contract --help
          /tmp/specadia-core/bin/specadia-doctor --version
          /tmp/specadia-core/bin/specadia-doctor --help
          /tmp/specadia-core/bin/python -m pip check
      - name: Test deterministic, path-redacted generation
        run: |
          gate_dir=$(mktemp -d)
          printf '# Inventory Requirements\n\n## REQ-001\nThe system shall record inventory transfers.\n' > "${gate_dir}/requirements.md"
          /tmp/specadia-core/bin/specadia-contract generate "${gate_dir}/requirements.md" --harness codex --output-dir "${gate_dir}/first"
          /tmp/specadia-core/bin/specadia-contract generate "${gate_dir}/requirements.md" --harness codex --output-dir "${gate_dir}/second"
          diff -ru "${gate_dir}/first" "${gate_dir}/second"
          if grep -R "${gate_dir}" "${gate_dir}/first"; then
            echo "generated artifacts exposed an absolute build path" >&2
            exit 1
          fi
      - name: Test clean full wheel and dependencies
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m venv /tmp/specadia-full
          /tmp/specadia-full/bin/python -m pip install --upgrade pip
          /tmp/specadia-full/bin/python -m pip install "${wheel}[full]" pip-audit
          /tmp/specadia-full/bin/python -c "import aiohttp, numpy, specadia._agents, specadia._rag"
          /tmp/specadia-full/bin/python -m pip check
          /tmp/specadia-full/bin/pip-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-${{ matrix.python-version }}
          path: dist/*

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm pack --dry-run
      - run: node --check .opencode/plugins/specadia.ts
      - run: node --check .pi/extensions/specadia.ts

  locked-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.12.0 pip-audit==2.10.1
      - run: uv lock --check
      - run: uv export --frozen --all-extras --no-dev --no-emit-project -o /tmp/specadia-lock.txt
      - run: pip-audit -r /tmp/specadia-lock.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag specadia-release-check .
      - run: docker run --rm specadia-release-check --version
